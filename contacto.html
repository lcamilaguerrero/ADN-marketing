<!-- ================= CONTACTO ================= -->
<section class="contacto-page">

    <div class="container-contacto">

        <!-- IZQUIERDA -->
        <div class="info-contacto">

            <p class="sub">HABLEMOS</p>

            <h1>Cuéntanos tu idea y<br>hagámosla realidad</h1>

            <p>
                Estamos listos para escuchar tu proyecto y ayudarte a llevarlo al siguiente nivel.
            </p>

            <!-- DATOS -->
            <div class="datos">

                <div class="dato">
                    <!-- ICONO -->
                    <img src="images/icon-mail.png" class="icono">
                    <p>info@adnmarketing.com</p>
                </div>

                <div class="dato">
                    <img src="images/icon-phone.png" class="icono">
                    <p>312 5870543</p>
                </div>

                <div class="dato">
                    <img src="images/icon-location.png" class="icono">
                    <p>Cll 8a #90-87</p>
                </div>

                <div class="dato">
                    <img src="images/icon-instagram.png" class="icono">
                    <p>ADN_Marketingbta</p>
                </div>

            </div>

        </div>

        <!-- DERECHA (FORMULARIO) -->
        <div class="formulario">

            <form>

                <input type="text" placeholder="Nombre">
                <input type="email" placeholder="Email">
                <input type="text" placeholder="Empresa">

                <textarea placeholder="Cuéntanos sobre tu proyecto"></textarea>

                <button type="submit">ENVIAR MENSAJE →</button>

            </form>

        </div>

    </div>

</section>
